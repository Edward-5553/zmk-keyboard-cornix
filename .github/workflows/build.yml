name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - "boards/**"
      - "config/**"
      - "scripts/test-dongle-*.py"
      - ".github/workflows/build.yml"
      - "build.yaml"
    tags-ignore:
      - "*"

jobs:
  display-tests:
    name: Check dongle display behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check battery labels, animation and portrait pixels
        run: |
          python3 scripts/test-dongle-battery.py --cc gcc
          python3 scripts/test-dongle-cat.py --cc gcc
          python3 scripts/test-dongle-portrait.py --cc gcc
      - name: Fetch LVGL revision used by Zephyr 4.1
        uses: actions/checkout@v4
        with:
          repository: zephyrproject-rtos/lvgl
          ref: 1ed1ddd881c3784049a92bb9fe37c38c6c74d998
          path: .build/lvgl
      - name: Render the real widgets and check visible text
        run: python3 scripts/test-dongle-render.py --lvgl-dir .build/lvgl --output-dir .build/dongle-preview
      - uses: actions/upload-artifact@v4
        with:
          name: dongle-display-preview
          path: .build/dongle-preview/*.svg
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
