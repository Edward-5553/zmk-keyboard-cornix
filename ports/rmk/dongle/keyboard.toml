Backslash Macro(0) Macro(1) Macro(2) Minus WM(Minus, LShift) WM(Equal, LShift) Equal WM(Dot, LShift) RightBracket WM(RightBracket, LShift) WM(Backslash, LShift)
LShift F2 F3 F4 F5 F6 CapsLock AudioMute F7 F8 F9 F10 F11 F12
