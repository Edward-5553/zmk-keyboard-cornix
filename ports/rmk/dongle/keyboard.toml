LCtrl No No WM(Delete, LCtrl | LAlt) WM(Space, LAlt) LT(1, Space) LT(2, Enter) Backspace No No No Delete
"""
encoders = [["MouseWheelDown", "MouseWheelUp"], ["AudioVolUp", "AudioVolDown"]]

