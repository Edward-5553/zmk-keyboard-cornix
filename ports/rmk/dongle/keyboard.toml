keys = """
No _ _ Up _ _ _ Kc7 Kc8 Kc9 _ _
No _ Left Down Right _ Dot Kc4 Kc5 Kc6 _ _
No WM(Z, LCtrl) WM(X, LCtrl) WM(C, LCtrl) WM(V, LCtrl) _ CapsLock AudioMute Kc0 Kc1 Kc2 Kc3 _ _
No No No _ _ _ _ _ _ No No No
"""
encoders = [["MouseWheelDown", "MouseWheelUp"], ["AudioVolUp", "AudioVolDown"]]

