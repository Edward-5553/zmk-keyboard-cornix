# Generated by tools/generate.py. Edit config/layout.toml instead.
[keyboard]
name = "Cornix RMK StopWatch"
product_name = "Cornix RMK S3"
manufacturer = "Cornix community"
vendor_id = 0x4c4b
product_id = 0x4643
chip = "esp32s3"
usb_enable = true

[storage]
enabled = true
start_addr = 0x3f0000
num_sectors = 16
clear_storage = false

[event.keyboard]
subs = 5

[event.connection_status_change]
subs = 2

[event.peripheral_connected]
subs = 2
channel_size = 4

[event.peripheral_battery]
subs = 3

[event.layer_change]
subs = 2

[event.wpm_update]
subs = 2

[event.action]
subs = 1

# Shared topology and keymap for all three images. Generated chip-specific
# keyboard.toml files must not be edited independently.
[rmk]
split_peripherals_num = 2
ble_profiles_num = 3
debounce_time = 5

[host]
vial_enabled = true
unlock_keys = [[0, 0], [4, 0]]

[ble]
enabled = true
use_2m_phy = false

[split]
connection = "ble"

[split.central]
rows = 0
cols = 0
row_offset = 0
col_offset = 0

[split.central.matrix]
row_pins = []
col_pins = []

[[split.peripheral]]
rows = 4
cols = 7
row_offset = 0
col_offset = 0
battery_adc_pin = "P0_05"
adc_divider_measured = 2000
adc_divider_total = 2806

[split.peripheral.matrix]
row_pins = ["P0_30", "P0_31", "P0_29", "P0_02"]
col_pins = ["P0_28", "P0_03", "P1_10", "P1_11", "P1_13", "P0_09", "P0_10"]
row2col = false

[[split.peripheral.input_device.encoder]]
pin_a = "P1_04"
pin_b = "P1_06"
internal_pullup = true
phase = "resolution"
resolution = 4

[[split.peripheral]]
rows = 4
cols = 7
row_offset = 4
col_offset = 0
