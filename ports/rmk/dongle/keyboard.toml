[behavior.morse]
permissive_hold = true
hold_on_other_press = false
unilateral_tap = false
enable_flow_tap = false
hold_timeout = "200ms"
gap_timeout = "200ms"
# RMK measures quick-tap from release, unlike the current ZMK press-to-press rule.
quick_tap_timeout = "150ms"

[[behavior.macro.macros]]
operations = [
  { operation = "text", text = "{}" },
  { operation = "tap", keycode = "Left" },
]

[[behavior.macro.macros]]
operations = [
  { operation = "text", text = "[]" },
  { operation = "tap", keycode = "Left" },
]

[[behavior.macro.macros]]
operations = [
  { operation = "text", text = "<>" },
  { operation = "tap", keycode = "Left" },
]
