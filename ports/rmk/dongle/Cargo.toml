[package]
name = "cornix-rmk-stopwatch"
version = "0.2.0"
description = "Native RMK split central for Cornix and M5Stack StopWatch"
repository = "https://github.com/Edward-5553/zmk-keyboard-cornix"
readme = "../README.md"
edition = "2024"
license = "MIT"

[features]
default = ["uart-log"]
uart-log = ["esp-println/uart"]
diagnostic-usb = ["esp-println/jtag-serial"]

[dependencies]
rmk = { git = "https://github.com/rmk-rs/rmk", rev = "f12257e89e9d07c461f4c774626b04af5b10600b", default-features = false, features = [
    "esp32s3_ble",
    "log",
    "storage",
    "vial", "host_lock", "split", "async_matrix"
] }
embassy-executor = { version = "0.10" }
esp-backtrace = { version = "0.20", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-hal = { version = "1.2.0-rc.0", features = ["esp32s3", "unstable"] }
esp-storage = { version = "0.10", features = ["embedded-storage", "esp32s3"] }
esp-alloc = { version = "0.11" }
# USB OTG is reserved for HID; send diagnostics to UART0 instead of Serial/JTAG.
esp-println = { version = "0.18", default-features = false, features = ["esp32s3", "log-04", "critical-section"] }
esp-radio = { version = "1.0.0-beta.0", features = ["esp32s3", "unstable", "ble"] }
esp-rtos = { version = "0.4", features = ["esp32s3", "esp-radio", "embassy"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3", "log-04"] }
bt-hci = { version = "0.10" }

embassy-time = "0.5"
embassy-futures = "0.1"
embassy-sync = "0.8"

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"
embuild = "0.33"
cc = "1.2.9"

[[bin]]
name = "cornix-rmk-stopwatch"
test = false
bench = false

[profile.dev.package.esp-storage]
opt-level = 3

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'thin'
opt-level = 3
overflow-checks = false

# Released esp-radio (1.0.0-beta.0) pins bt-hci 0.8, which predates the shared
# bt-hci-transport trait rmk/trouble-host need. Pin the whole esp graph to esp-rs/esp-hal
# main, which pairs esp-hal 1.2.0-rc.0 with an esp-radio that speaks bt-hci-transport.
[patch.crates-io]
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", rev = "5363c4c493f5f11654696ff192028cf45f04ba72" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal.git", rev = "5363c4c493f5f11654696ff192028cf45f04ba72" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal.git", rev = "5363c4c493f5f11654696ff192028cf45f04ba72" }
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", rev = "5363c4c493f5f11654696ff192028cf45f04ba72" }
esp-println = { git = "https://github.com/esp-rs/esp-hal.git", rev = "5363c4c493f5f11654696ff192028cf45f04ba72" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", rev = "5363c4c493f5f11654696ff192028cf45f04ba72" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", rev = "5363c4c493f5f11654696ff192028cf45f04ba72" }
esp-storage = { git = "https://github.com/esp-rs/esp-hal.git", rev = "5363c4c493f5f11654696ff192028cf45f04ba72" }
