## use ws2812-spi
CONFIG_SPI=y
#CONFIG_WS2812_STRIP=y
CONFIG_LED_STRIP=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_WS2812=y
CONFIG_RGBLED_WIDGET_LED_COUNT=2

CONFIG_RGBLED_WIDGET_BRIGHTNESS=64
# Turn off the WS2812 power rail 1 second after the indicators become idle.
CONFIG_RGBLED_WIDGET_EXT_POWER_TIMEOUT_MS=1000

CONFIG_RGBLED_WIDGET_LED_SHARING=y

# Charging indication uses USB power detection even on BLE-only peripherals.
# USB_DEVICE_STACK selects the USB driver; Zephyr 4.1 has no CONFIG_USB option.
CONFIG_USB_DEVICE_STACK=y
CONFIG_ZMK_BATTERY_REPORTING=y

# Local battery on LED 0, connectivity on LED 1.
# The widget pulses green every 2 s while USB-powered and below 99%.
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_SELF=y
CONFIG_RGBLED_WIDGET_SPATIAL_MAPPING=y
CONFIG_RGBLED_WIDGET_BATTERY_LED_INDEX=0
CONFIG_RGBLED_WIDGET_CONN_LED_INDEX=1
CONFIG_RGBLED_WIDGET_ANIMATIONS=y
CONFIG_RGBLED_WIDGET_ANIMATION_TICK_MS=50
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_CHARGING=2
CONFIG_RGBLED_WIDGET_BATTERY_BLINK_MS=2000
