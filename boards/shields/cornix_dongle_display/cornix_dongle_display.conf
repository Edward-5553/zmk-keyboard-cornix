CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
# Keep 10 fps cat playback while halving periodic display work submissions.
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=20
# Decode indexed images one row at a time, preserving the 16 KiB LVGL pool.
CONFIG_LV_BIN_DECODER_RAM_LOAD=n
